# Objeto App. Las fórmulas completas y comentadas están en
# canvas-app/formulas/00-app-y-tema.md
App:
  Properties:
    StartScreen: =scrInicio
    BackEnabled: =false
    Theme: =PowerAppsTheme
    OnStart: |-
      =Set(gblUsuario, User());
      Set(gblHoy, Today());

      ClearCollect(colParametros, Parametros);

      // "en-US" es obligatorio: en la lista los decimales van con punto y
      // Value() usa el separador regional del usuario.
      Set(gblTCUSD, Coalesce(Value(LookUp(colParametros, Title = "TC_USD", Valor), "en-US"), 1));
      Set(gblTCEUR, Coalesce(Value(LookUp(colParametros, Title = "TC_EUR", Valor), "en-US"), 1));
      Set(gblMonedaBase, Coalesce(LookUp(colParametros, Title = "MONEDA_BASE", Valor), "PEN"));
      Set(gblDiasPreavisoDefault, Coalesce(Value(LookUp(colParametros, Title = "DIAS_PREAVISO_DEFAULT", Valor), "en-US"), 30));
      Set(gblDocuSignHabilitado, Lower(Coalesce(LookUp(colParametros, Title = "DOCUSIGN_HABILITADO", Valor), "false")) = "true");

      Set(gblEsAdmin, gblUsuario.Email in Split(Coalesce(LookUp(colParametros, Title = "ADMINS", Valor), ""), ";").Value);
      Set(gblEsCustodio, gblEsAdmin || gblUsuario.Email in Split(Coalesce(LookUp(colParametros, Title = "CUSTODIOS", Valor), ""), ";").Value);
      Set(gblEsLegal, gblEsAdmin || gblUsuario.Email in Split(Coalesce(LookUp(colParametros, Title = "LEGAL", Valor), ""), ";").Value);

      ClearCollect(colAreas, Filter(Areas, Activo = true));

      // Categorias: carpetas administrables (Logistica, Comercial, RRHH...).
      // Lista pequena y estable, igual que colAreas: se cachea una vez por sesion.
      ClearCollect(colCategorias, Filter(Categorias, Activo = true));

      ClearCollect(colEstadosFiltro,
          {Valor: "(Todos)"}, {Valor: "Borrador"}, {Valor: "En revision legal"},
          {Valor: "En aprobacion"}, {Valor: "Aprobado"}, {Valor: "En firma"},
          {Valor: "Vigente"}, {Valor: "Por vencer"}, {Valor: "Vencido"},
          {Valor: "Renovado"}, {Valor: "Terminado"}, {Valor: "Rechazado"},
          {Valor: "Anulado"});

      // Paleta corporativa AB Mauri (fuente: skill "tableros-abmauri",
      // references/guia.md v1.0 — el mismo estándar de los tableros HTML de
      // Financial Review, Costos, Compras, Nómina y Cuentas por Cobrar).
      // Un solo cambio aquí actualiza toda la app: ninguna pantalla usa color
      // literal, todas leen gblTema.
      Set(gblTema, {
          Primario:        RGBA(104, 16, 41, 1),    // --burgundy #681029 — barra superior, cabeceras, títulos
          PrimarioOscuro:  RGBA(78, 12, 31, 1),      // --deep     #4e0c1f — granate profundo (hover, énfasis)
          PrimarioSuave:   RGBA(255, 244, 230, 1),   // --pale     #fff4e6 — fondos suaves sobre tarjetas
          Acento:          RGBA(255, 153, 6, 1),     // --orange   #ff9906 — acentos y CTA secundario
          Fondo:           RGBA(242, 237, 232, 1),   // --bg       #F2EDE8 — fondo de página
          Tarjeta:         RGBA(255, 255, 255, 1),
          Borde:           RGBA(230, 221, 213, 1),   // --line     #e6ddd5
          Texto:           RGBA(44, 26, 14, 1),      // --navy     #2c1a0e — texto (pese al nombre, es tinta oscura)
          TextoSuave:      RGBA(122, 106, 95, 1),    // gris cálido derivado de la familia --brown/--line
          TextoClaro:      RGBA(255, 255, 255, 1),
          Exito:           RGBA(55, 86, 35, 1),      // --good     #375623
          Advertencia:     RGBA(201, 138, 0, 1),     // --warn     #c98a00
          Error:           RGBA(192, 0, 0, 1),       // --bad      #C00000
          Info:            RGBA(168, 105, 43, 1),    // --gold     #A8692B
          Fuente:          "'Segoe UI', Arial, sans-serif",
          Radio:           8,
          Espaciado:       16,
          FuenteTitulo:    20,
          FuenteBase:      14,
          FuenteMenor:     12
      });
