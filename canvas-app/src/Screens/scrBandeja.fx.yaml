# Bandeja: navegación por carpetas (categorías) + búsqueda con filtros.
# La consulta se construye en ramas para que cada combinación se delegue entera:
# 3 dimensiones opcionales (categoría, estado, tipo) => 8 ramas explícitas. Es
# mecánico, pero cada rama es un único Filter() con condiciones ANDadas y sin
# mezclar una condición constante con una de fila — ver la regla de delegación
# en canvas-app/formulas/00-app-y-tema.md.
# Fórmulas comentadas en canvas-app/formulas/01-inicio-y-bandeja.md
Screens:
  scrBandeja:
    Properties:
      Fill: =gblTema.Fondo
      OnVisible: |-
        =UpdateContext({
            locEstado: If(gblFiltroEntrada = "Por vencer", "Por vencer",
                       If(gblFiltroEntrada = "Vigente", "Vigente",
                       If(gblFiltroEntrada = "Vencido", "Vencido", "(Todos)"))),
            locTipo: "(Todos)",
            locCategoriaId: 0,
            locCategoriaNombre: "Todas las categorías",
            locSoloMios: false
        });
        Set(gblFiltroEntrada, Blank());
        Reset(txtBuscar)
    Children:
      - recCabeceraB:
          Control: Rectangle
          Properties:
            Fill: =gblTema.Primario
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
      - icoVolver:
          Control: Classic/Icon
          Properties:
            Icon: =Icon.Back
            X: =16
            Y: =16
            Width: =32
            Height: =32
            Color: =gblTema.TextoClaro
            OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
      - lblTituloB:
          Control: Label
          Properties:
            Text: ="Contratos"
            X: =60
            Y: =16
            Width: =300
            Height: =32
            Color: =gblTema.TextoClaro
            Size: =gblTema.FuenteTitulo
            FontWeight: =FontWeight.Semibold

      # --- Panel lateral de carpetas (categorías) ----------------------------
      - recRail:
          Control: Rectangle
          Properties:
            Fill: =gblTema.Tarjeta
            X: =0
            Y: =64
            Width: =220
            Height: =Parent.Height - 64
      - recRailBorde:
          Control: Rectangle
          Properties:
            Fill: =gblTema.Borde
            X: =219
            Y: =64
            Width: =1
            Height: =Parent.Height - 64
      - lblRailTitulo:
          Control: Label
          Properties:
            Text: ="Carpetas"
            X: =20
            Y: =80
            Width: =180
            Height: =24
            Size: =gblTema.FuenteMenor
            Color: =gblTema.TextoSuave
            FontWeight: =FontWeight.Semibold
      - btnCategoriaTodas:
          Control: Classic/Button
          Properties:
            Text: ="■  Todas las categorías"
            X: =12
            Y: =108
            Width: =196
            Height: =40
            Align: =Align.Left
            PaddingLeft: =12
            BorderThickness: =0
            Fill: |-
              =If(locCategoriaId = 0, gblTema.PrimarioSuave, gblTema.Tarjeta)
            Color: |-
              =If(locCategoriaId = 0, gblTema.Primario, gblTema.Texto)
            Font: =Font.'Open Sans'
            FontWeight: |-
              =If(locCategoriaId = 0, FontWeight.Semibold, FontWeight.Normal)
            Size: =gblTema.FuenteBase
            OnSelect: |-
              =UpdateContext({locCategoriaId: 0, locCategoriaNombre: "Todas las categorías"})
      - galCategorias:
          Control: Gallery
          Variant: Vertical
          Properties:
            X: =12
            Y: =152
            Width: =196
            Height: =Parent.Height - 188
            TemplateSize: =40
            Items: =SortByColumns(colCategorias, "Orden", SortOrder.Ascending)
          Children:
            - recCatFondo:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =40
                  BorderRadius: =6
                  Fill: |-
                    =If(ThisItem.ID = locCategoriaId, gblTema.PrimarioSuave, gblTema.Tarjeta)
                  OnSelect: |-
                    =UpdateContext({locCategoriaId: ThisItem.ID, locCategoriaNombre: ThisItem.Title})
            - recCatColor:
                Control: Rectangle
                Properties:
                  X: =12
                  Y: =14
                  Width: =12
                  Height: =12
                  BorderRadius: =6
                  Fill: |-
                    =Coalesce(ColorValue(ThisItem.Color), gblTema.TextoSuave)
            - lblCatNombre:
                Control: Label
                Properties:
                  Text: =ThisItem.Title
                  X: =32
                  Y: =0
                  Width: =Parent.TemplateWidth - 40
                  Height: =40
                  Size: =gblTema.FuenteBase
                  Color: |-
                    =If(ThisItem.ID = locCategoriaId, gblTema.Primario, gblTema.Texto)
                  FontWeight: |-
                    =If(ThisItem.ID = locCategoriaId, FontWeight.Semibold, FontWeight.Normal)

      # --- Filtros (a la derecha del panel de carpetas) ----------------------
      - lblFiltrandoPor:
          Control: Label
          Properties:
            Text: |-
              ="Carpeta: " & locCategoriaNombre
            X: =244
            Y: =76
            Width: =600
            Height: =20
            Size: =gblTema.FuenteMenor
            Color: =gblTema.TextoSuave
      - txtBuscar:
          Control: Classic/TextInput
          Properties:
            HintText: ="Empieza a escribir el código, nombre o contraparte"
            X: =244
            Y: =100
            Width: =(Parent.Width - 292) * 0.44
            Height: =40
            BorderColor: =gblTema.Borde
      - cmbEstado:
          Control: Classic/ComboBox
          Properties:
            Items: =colEstadosFiltro
            DisplayFields: =["Valor"]
            SearchFields: =["Valor"]
            SelectMultiple: =false
            DefaultSelectedItems: =LookUp(colEstadosFiltro, Valor = locEstado)
            X: =244 + (Parent.Width - 292) * 0.44 + 12
            Y: =100
            Width: =(Parent.Width - 292) * 0.27
            Height: =40
            OnChange: |-
              =UpdateContext({locEstado: Coalesce(cmbEstado.Selected.Valor, "(Todos)")})
      - cmbTipo:
          Control: Classic/ComboBox
          Properties:
            Items: |-
              =Ungroup(
                  Table({v: Table({Value: "(Todos)"})}, {v: Choices(Contratos.TipoContrato)}),
                  "v")
            DisplayFields: =["Value"]
            SearchFields: =["Value"]
            SelectMultiple: =false
            X: =244 + (Parent.Width - 292) * 0.71 + 24
            Y: =100
            Width: =(Parent.Width - 292) * 0.27
            Height: =40
            OnChange: |-
              =UpdateContext({locTipo: Coalesce(cmbTipo.Selected.Value, "(Todos)")})

      # --- Listado ------------------------------------------------------------
      - galContratos:
          Control: Gallery
          Variant: Vertical
          Properties:
            X: =244
            Y: =156
            Width: =Parent.Width - 268
            Height: =Parent.Height - 188
            TemplateSize: =92
            TemplatePadding: =6
            Items: |-
              =SortByColumns(
                  With({_buscar: Trim(txtBuscar.Text)},
                      Switch(
                          (locCategoriaId <> 0) & "|" & (locEstado <> "(Todos)") & "|" & (locTipo <> "(Todos)"),

                          "true|true|true",
                              Filter(Contratos,
                                  Categoria.Id = locCategoriaId, Estado.Value = locEstado, TipoContrato.Value = locTipo,
                                  StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar)),

                          "true|true|false",
                              Filter(Contratos,
                                  Categoria.Id = locCategoriaId, Estado.Value = locEstado,
                                  StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar)),

                          "true|false|true",
                              Filter(Contratos,
                                  Categoria.Id = locCategoriaId, TipoContrato.Value = locTipo,
                                  StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar)),

                          "true|false|false",
                              Filter(Contratos,
                                  Categoria.Id = locCategoriaId,
                                  StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar)),

                          "false|true|true",
                              Filter(Contratos,
                                  Estado.Value = locEstado, TipoContrato.Value = locTipo,
                                  StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar)),

                          "false|true|false",
                              Filter(Contratos,
                                  Estado.Value = locEstado,
                                  StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar)),

                          "false|false|true",
                              Filter(Contratos,
                                  TipoContrato.Value = locTipo,
                                  StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar)),

                          Filter(Contratos,
                              StartsWith(Title, _buscar) || StartsWith(NombreContrato, _buscar) || StartsWith(Contraparte, _buscar))
                      )
                  ),
                  "FechaFin", SortOrder.Ascending)
            OnSelect: |-
              =Set(gblContrato, ThisItem);
              Navigate(scrDetalle, ScreenTransition.Fade)
          Children:
            - recFila:
                Control: Rectangle
                Properties:
                  Fill: =gblTema.Tarjeta
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =86
                  BorderRadius: =gblTema.Radio
                  BorderColor: =gblTema.Borde
                  BorderThickness: =1
            - recEstadoBarra:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =5
                  Height: =86
                  Fill: |-
                    =Switch(ThisItem.Estado.Value,
                        "Vigente", gblTema.Exito,
                        "Aprobado", gblTema.Exito,
                        "Por vencer", gblTema.Advertencia,
                        "En aprobacion", gblTema.Info,
                        "En revision legal", gblTema.Info,
                        "En firma", gblTema.Info,
                        "Vencido", gblTema.Error,
                        "Rechazado", gblTema.Error,
                        gblTema.TextoSuave)
            - lblFilaCodigo:
                Control: Label
                Properties:
                  Text: =Coalesce(ThisItem.Title, "(sin código)")
                  X: =18
                  Y: =10
                  Width: =140
                  Height: =22
                  Color: =gblTema.TextoSuave
                  Size: =gblTema.FuenteMenor
                  FontWeight: =FontWeight.Semibold
            - lblFilaNombre:
                Control: Label
                Properties:
                  Text: =ThisItem.NombreContrato
                  X: =18
                  Y: =30
                  Width: =Parent.TemplateWidth * 0.38
                  Height: =24
                  Size: =gblTema.FuenteBase
                  FontWeight: =FontWeight.Semibold
            - lblFilaContraparte:
                Control: Label
                Properties:
                  Text: |-
                    =ThisItem.Contraparte &
                     If(IsBlank(ThisItem.ContraparteRUC), "", " · RUC " & ThisItem.ContraparteRUC)
                  X: =18
                  Y: =54
                  Width: =Parent.TemplateWidth * 0.38
                  Height: =22
                  Color: =gblTema.TextoSuave
                  Size: =gblTema.FuenteMenor
            - lblFilaCategoria:
                Control: Label
                Properties:
                  Text: |-
                    =If(IsBlank(ThisItem.Categoria), "", "▸ " & ThisItem.Categoria.Value)
                  X: =18
                  Y: =74
                  Width: =Parent.TemplateWidth * 0.38
                  Height: =18
                  Color: =gblTema.Info
                  Size: =10
            - lblFilaMonto:
                Control: Label
                Properties:
                  Text: |-
                    =If(ThisItem.SinMontoDeterminado, "Monto no determinado",
                        ThisItem.Moneda.Value & " " & Text(ThisItem.Monto, "#,##0.00"))
                  X: =Parent.TemplateWidth * 0.42
                  Y: =30
                  Width: =Parent.TemplateWidth * 0.2
                  Height: =24
                  Size: =gblTema.FuenteBase
            - lblFilaVigencia:
                Control: Label
                Properties:
                  Text: |-
                    =Text(ThisItem.FechaInicio, "dd/mm/yyyy") & " → " &
                     If(ThisItem.VigenciaIndefinida, "indefinida", Text(ThisItem.FechaFin, "dd/mm/yyyy"))
                  X: =Parent.TemplateWidth * 0.42
                  Y: =54
                  Width: =Parent.TemplateWidth * 0.25
                  Height: =22
                  Color: =gblTema.TextoSuave
                  Size: =gblTema.FuenteMenor
            - lblFilaEstado:
                Control: Label
                Properties:
                  Text: =ThisItem.Estado.Value
                  X: =Parent.TemplateWidth - 200
                  Y: =30
                  Width: =130
                  Height: =24
                  Align: =Align.Right
                  Size: =gblTema.FuenteMenor
                  FontWeight: =FontWeight.Semibold
            - icoFilaCustodia:
                Control: Classic/Icon
                Properties:
                  Icon: |-
                    =Switch(ThisItem.EstadoCustodia.Value,
                        "En custodia", Icon.Lock,
                        "Prestado", Icon.Clock,
                        "Solo digital", Icon.Document,
                        Icon.Warning)
                  Tooltip: |-
                    ="Custodia: " & ThisItem.EstadoCustodia.Value
                  X: =Parent.TemplateWidth - 56
                  Y: =30
                  Width: =24
                  Height: =24
                  Color: |-
                    =Switch(ThisItem.EstadoCustodia.Value,
                        "En custodia", gblTema.Exito,
                        "Prestado", gblTema.Advertencia,
                        "Pendiente de recepcion", gblTema.Error,
                        gblTema.TextoSuave)
      - lblSinResultados:
          Control: Label
          Properties:
            Text: |-
              =If(IsBlank(Trim(txtBuscar.Text)) && locEstado = "(Todos)" && locTipo = "(Todos)" && locCategoriaId = 0,
                  "Todavía no hay contratos registrados.",
                  "Ningún contrato coincide con la búsqueda. Prueba con menos filtros.")
            X: =244
            Y: =196
            Width: =Parent.Width - 268
            Height: =48
            Align: =Align.Center
            Color: =gblTema.TextoSuave
            Visible: =CountRows(galContratos.AllItems) = 0
